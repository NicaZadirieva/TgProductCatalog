# HTTP — для ACME-челленджа и редиректа
server {
    listen 80;
    server_name nica-product-catalog.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

